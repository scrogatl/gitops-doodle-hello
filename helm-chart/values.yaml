name: doodle-hello
replicaCount: 1
labels:
  app.kubernetes.io/name: doodle-hello
  app.kubernetes.io/instance: hello-xyzz
  app.kubernetes.io/version: "0.9.1"
  app.kubernetes.io/component: service
  app.kubernetes.io/part-of: helloworld
image:
  repository: ghcr.io/scrogatl/doodle-hello
  tag: main
  pullPolicy: Always
containerName: doodle-hello
env:
- name: SHARD
  value: blue
- name: PYTHONUNBUFFERED
  value: '1'
- name: ERROR_THRESH
  value: '10'
- name: WEATHER_HOST
  value: doodle-weather
- name: W_PORT
  value: '5100'
- name: WEATHER_THRESH
  value: '25'
ports:
- containerPort: 5001
  name: application
  protocol: TCP
service:
  name: doodle-hello
  type: ClusterIP
  ports:
  - name: http
    appProtocol: http
    port: 5001
